name: Bug report
description: Something behaves differently from what it promises
labels: ["type:fix"]
body:
  - type: markdown
    attributes:
      value: |
        Describe what you observed, not what you concluded. A cause you did not
        confirm reads exactly like one you did.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The observed behaviour. Paste the actual error or output rather than describing it.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
      description: State the promise being broken — a documented behaviour, a type signature, a README line.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: |
        Numbered steps someone else can follow. If you could not reproduce it a
        second time, say so — an intermittent failure is worth reporting as
        intermittent, not as reliable.
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: |
        Judge by impact, not by how hard the fix looks. A maintainer applies the
        matching priority label; leave it at "not sure" rather than guessing.
      options:
        - "not sure"
        - "low — when convenient: friction, cosmetics, nice-to-haves"
        - "medium — do soon: works but is wrong or degrading"
        - "high — do next: broken or unsafe now"
      default: 0
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which layer this sits in. Pick the one a fix would touch first.
      options:
        - "not sure"
        - "ui — screens, components, styles"
        - "sim — the MLS-MPM solver, its WebGPU pipeline and the scenes under src/sim"
        - "build — build, compile, lint/format config, dependencies"
        - "ci — CI pipelines and git hooks"
        - "test — test suites and coverage config"
        - "infra — deployment target and runtime environment"
      default: 0
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Version, browser, OS, deploy target — whatever is load-bearing here.
      placeholder: Leave empty if the bug does not depend on any of it.
